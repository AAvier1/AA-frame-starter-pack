<!DOCTYPE html>
<html>

<head>
  <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.5.4/dist/aframe-extras.min.js"></script>
  <script>
    // Code to let me walk on the ground of the 3D model
    AFRAME.registerComponent('ground-follow', {
      schema: {
        target: { type: 'selector' },
        stepHeight: { default: 1.5 }
      },
      init() {
        this.ray = new THREE.Raycaster();
        this.down = new THREE.Vector3(0, -1, 0);
        this.origin = new THREE.Vector3();
        this.meshes = [];
        this.first = true;

        const collect = () => {
          this.meshes = [];
          this.data.target.object3D.traverse(o => o.isMesh && this.meshes.push(o));
        };
        if (this.data.target.getObject3D('mesh')) collect();
        this.data.target.addEventListener('model-loaded', collect);
      },
      tick() {
        if (!this.meshes.length) return;
        const pos = this.el.object3D.position;
        this.origin.set(pos.x, this.first ? 500 : pos.y + this.data.stepHeight, pos.z);
        this.ray.set(this.origin, this.down);

        const hit = this.ray.intersectObjects(this.meshes, false)[0];
        if (!hit) return;
        pos.y = this.first ? hit.point.y : pos.y + (hit.point.y - pos.y) * 0.4;
        this.first = false;
      }
    });

    // Code that let's me drop an entity onto the surface
    AFRAME.registerComponent('snap-to-ground', {
      schema: {
        target: { type: 'selector' },
        offset: { default: 0 }
      },
      init() {
        const snap = () => {
          const t = this.data.target;
          if (!t.getObject3D('mesh')) return;
          t.object3D.updateMatrixWorld(true);
          const p = this.el.object3D.position;
          const ray = new THREE.Raycaster(
            new THREE.Vector3(p.x, 500, p.z),
            new THREE.Vector3(0, -1, 0)
          );
          const hit = ray.intersectObject(t.object3D, true)[0];
          if (hit) p.y = hit.point.y + this.data.offset;
        };
        snap();
        this.data.target.addEventListener('model-loaded', snap);
      }
    });

  </script>
</head>

<body>
  <a-scene>
    <a-assets>
      <a-asset-item id="world" src="asset/low_poly_forest.glb"></a-asset-item>
      <a-img id="sky" src="asset/Sky-background.jpg"></a-asset-item>
      <a-asset-item id="cat" src="asset/chill_cat.glb"></a-asset-item>
    </a-assets>

    <!-- 3D World -->
    <a-entity id="world-entity" gltf-model="#world" scale="8 8 8"></a-entity>
    <img id="sky" src="asset/Sky-background.jpg">

    <!-- Cat -->
    <a-entity gltf-model="#cat"
              snap-to-ground="target: #world-entity"
              position="-20 0 7.7"
              scale="1 1 1"
              rotation="0 180 0"></a-entity>

    <!-- Sky -->
    <a-sky src="#sky"></a-sky>

    <!-- Camera -->
    <a-entity id="rig" movement-controls="speed: 0.3" ground-follow="target: #world-entity" position="12.4 0 8.7">
      <a-entity camera position="0 0.55 0" look-controls></a-entity>
    </a-entity>
  </a-scene>
</body>

</html>
