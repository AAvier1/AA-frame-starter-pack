<!DOCTYPE html>
<html>
  <head>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"> </script>
     <script src="https://unpkg.com/aframe-environment-component/dist/aframe-environment-component.min.js"></script>
  </head>
  <body>
    <a-scene>
      // Body
      <a-sphere position="0 1.25 -5" radius="1.50" color="#FFFFFF"></a-sphere>
      <a-sphere position="0 3.25 -5" radius="1.25" color="#FFFFFF"></a-sphere>
      <a-sphere position="0 5.25 -5" radius="1.00" color="#FFFFFF"></a-sphere>
      // Buttons
      <a-sphere position="0 3.60 -3.78" radius="0.15" color="#343434"></a-sphere>
      <a-sphere position="0 3.20 -3.78" radius="0.15" color="#343434"></a-sphere>
      <a-sphere position="0 2.80 -3.78" radius="0.15" color="#343434"></a-sphere>
      // Eyes
      <a-sphere position="0.5 5.00 -4.20" radius="0.10" color="#343434"></a-sphere>
      <a-sphere position="-0.5 5.00 -4.20" radius="0.10" color="#343434"></a-sphere>

      // Arm sticks
      <a-cylinder position="1.40 3.00 -5" radius="0.10" height="2.20" color="#964B00"></a-cylinder>
      <a-cylinder position="-1.40 3.00 -5" radius="0.10" height="2.20" color="#964B00"></a-cylinder>

      // Nose
      <a-triangle position="0 4.50 -4" vertex-a="-0.15 0 0" vertex-b="0.15 0 0" vertex-c="0 0.50 0" color="#F08000"></a-triangle>

  
      <!-- the enviroment entity includes a sky. Choose from the presets"none, default, contact, egypt, checkerboard, forest, goaland, yavapai, goldmine, threetowers, poison, arches, tron, japan, dream, volcano, starry, osiris, moon" -->
      <a-entity environment="preset: moon; dressingAmount: 500"></a-entity>
    </a-scene>
  </body>
</html>
