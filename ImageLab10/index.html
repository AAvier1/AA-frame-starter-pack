<!DOCTYPE html>
<html>

<head>
  <script src="https://aframe.io/releases/1.7.1/aframe.min.js"> </script>
</head>

<body>
  <a-scene>
    <a-assets>
      <img id="beach" src="beach-360.jpg">
    </a-assets>
    <!-- volleyball -->
    <a-sphere position="-1 0.15 -5" radius="0.75" color="#FFFFF"></a-sphere>
    <!-- Umbrella -->
    <a-cylinder position="1.25 0.85 -2" radius="0.05" height="1.5" color="#FFCCC"></a-cylinder>
    <a-cone position="1.25 1.85 -2" radius-bottom="1.5" radius-top="0.15" height="0.5" color="#4169E1"></a-cone>
    <a-sky src="#beach"></a-sky>
  </a-scene>
</body>

</html>
